<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>幽拐コインランドリー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #111; color: #fff; overflow: hidden; margin: 0; font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    html, body, #root { height: 100%; }
    @keyframes glitchText {
      0%, 100% { text-shadow: 2px 0 #ff0040, -2px 0 #00d0ff; }
      25% { text-shadow: -2px 0 #ff0040, 2px 0 #00d0ff; }
      50% { text-shadow: 2px 2px #ff0040, -2px -2px #00d0ff; }
    }
    .glitch-text { animation: glitchText 0.3s infinite; font-family: monospace; letter-spacing: 0.05em; }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    .flicker { animation: flicker 0.15s infinite; }
    .vignette-1 { box-shadow: inset 0 0 80px rgba(80,10,30,0.3); }
    .vignette-2 { box-shadow: inset 0 0 100px rgba(80,10,30,0.5); }
    .vignette-3 { box-shadow: inset 0 0 120px rgba(80,10,30,0.7); }
    .vignette-4 { box-shadow: inset 0 0 150px rgba(120,10,30,0.85); filter: hue-rotate(-10deg) contrast(1.1); }
    .vignette-5 { box-shadow: inset 0 0 200px rgba(180,10,30,0.95); filter: hue-rotate(-15deg) contrast(1.2) saturate(1.3); }
    img { max-width: 100%; height: auto; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module" src="app.js"></script>
</body>
</html>
